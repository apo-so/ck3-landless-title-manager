 SLTM_LVM_TREASURY_BUDGET_COURTIER_SHORT:0 "臣"
 SLTM_LVM_TREASURY_BUDGET_COURTIER_TT:0 "臣：#high 天子朝臣预算发放#!\n中央发放：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_ministry_central_candidate_probe_value')|2]\n实际到账：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_ministry_receipt_value')|3]\n省部掾吏加成：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_d24_ministry_bureaucrat_mult')|1%]　个人荣典：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_d24_ministry_personal_honors_mult')|1%]\n\n#weak ‘发’是中央支出；‘收’是受益者最终 Treasury 到账。省部掾吏按每名适性档位 +1%～+5%，最多两人叠加；个人荣典另按原版倍率计入。#!"
 SLTM_LVM_TREASURY_BUDGET_DEVELOPMENT_SHORT:0 "发"
 SLTM_LVM_TREASURY_BUDGET_DEVELOPMENT_TT:0 "发：#high 天子封臣发展金发放#!\n中央发放：[Multiply_CFixedPoint(Multiply_CFixedPoint(Character.MakeScope().ScriptValue('sltm_lvm_treasury_d21_taxable_rebuilt_candidate'), Character.GetVassalContract.GetTaxRatioForLiege), Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_development_vanilla_factor_probe_value'))|2]\n应税收入：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_d21_taxable_rebuilt_candidate')|2]　缴纳比例：[Multiply_CFixedPoint(Character.GetVassalContract.GetTaxRatioForLiege, '(CFixedPoint)100')|1]%　发展金倍率：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_development_vanilla_factor_probe_value')|2]\n\n#weak 公式：应税收入 × 缴纳比例 × 发展金倍率。D4 历史实机已直接对账：天子对李参支出约45.6，李参原版国库收入“封臣发展金”约+45.6，因此右侧“收”与该中央转移同值；固定拨款 monthly_treasury_from_liege_add 仍在独立列。#!"
 SLTM_LVM_TREASURY_BUDGET_MILITARY_SHORT:0 "军"
 SLTM_LVM_TREASURY_BUDGET_MILITARY_TT:0 "军：#high 天子军事预算发放#!\n中央发放：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_military_central_candidate_probe_value')|2]\n已知受益者倍率：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_d26_military_total_known_mult')|1%]\n\n#weak ‘发’是中央支出；‘收’按受益者倍率计算实际 Treasury 到账。原版中国庄园、天朝武勋抱负、大征伐均已纳入；行政制家族属性‘军需官’由右栏 typed HouseAspiration 按等级自动追加 +5/+10/+15%。#!"
 SLTM_LVM_TREASURY_BUDGET_RECEIPT_TT:0 "#high 天子国库发放#!\n左侧#high 俸 / 发 / 军 / 臣#!四项统一表示天子中央国库对该人物记账的月度支出，不等于受益者最终到账。\n\n#P 四项现均进入正式列表显示；实际到账统一放在右侧详情中单独查看。#!"
 SLTM_LVM_TREASURY_BUDGET_SALARY_SHORT:0 "俸"
 SLTM_LVM_TREASURY_BUDGET_SALARY_TT:0 "俸：#high 天子俸禄预算发放#!\n中央发放：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_salary_central_candidate_probe_value')|2]\n实际到账：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_budget_salary_receipt_value')|3]\n受益者额外倍率：[Character.MakeScope().ScriptValue('sltm_lvm_treasury_d26_salary_total_mult')|1%]\n\n#weak ‘发’是天子中央国库记账支出；‘收’是受益者最终 Gold 到账。实际到账已纳入俸禄契约、中国庄园、家族抱负、详细账簿及原版具名修正。#!"

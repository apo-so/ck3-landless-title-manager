 SLTM_LVM_TREASURY_D26_CRITERIA:0 "#P 批量判读：#!每人都把上方“收候选”与其原版 Gold/Treasury 收入明细对应分类比较。优先测试李参、一个军>0且庄园/家族不同者、一个臣>0官员、一个有俸禄额外倍率者。#P Δ≤0.01 视为精确PASS；0.01～0.05检查显示精度；>0.05记录残差来源。#!\n#weak D25 的 Character typed getter 与无后缀接口已退役。当前唯一静态未能自动识别的是行政制 army_quartermasters：其原版确有 +5/+10/+15%，但 aspiration 本身没有唯一 script parameter；右上角显示当前家族抱负与等级索引，若正是军需官则用 L1/L2/L3 假设对照。外部 Mod 若另加同名 budget mult，仍可能产生残差。#!"

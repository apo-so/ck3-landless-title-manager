l_simp_chinese:
 SLTM_REL_ESTABLISH:0 "建立礼节关系"
 SLTM_REL_REMOVE:0 "解除礼节关系"
 SLTM_REL_ESTABLISH_TT:0 "先在实权者的主头衔页点击“标记头衔”，再打开礼节王座属性页右侧的“礼节关系”。点击后，王座持有者将成为实权者的直属封臣。"
 SLTM_REL_REMOVE_TT:0 "解除当前王座与实权头衔的关联，保留双方头衔、政体和现有封臣关系；不会自动独立。"
 SLTM_REL_STATUS_ACTIVE:0 "礼节君主关系已建立"
 SLTM_REL_STATUS_INVALID:0 "关联已失效，可解除后重新建立"
 SLTM_REL_STATUS_NONE:0 "尚未建立礼节关系"
 SLTM_REL_REVIEW_TITLE:0 "礼节君主关系"
 SLTM_REL_REVIEW_ESTABLISH:0 "礼节王座：[sltm_rel_throne.GetName]\n礼节君主：[sltm_rel_monarch.GetName]\n实权头衔：[sltm_rel_regent_title.GetName]\n实权统治者：[sltm_rel_regent.GetName]\n\n确认后，礼节君主及其现有领地、封臣将归入实权统治者的直属统辖。双方政体保留。\n\n双方原有礼节关联会被替换，原头衔保留。不会额外创建头衔，也不会更改领国继承制度。"
 SLTM_REL_REVIEW_REMOVE:0 "解除[sltm_rel_throne.GetName]与实权头衔的礼节关联。\n\n双方头衔、政体和现有领地及封臣关系均保留；这项操作不会让礼节君主自动独立。"
 SLTM_REL_CONFIRM_ESTABLISH:0 "建立关系并调整直属统辖"
 SLTM_REL_CONFIRM_REMOVE:0 "解除礼节关系"
 SLTM_REL_CANCEL:0 "返回头衔属性"
 SLTM_REL_NEED_DIFFERENT:0 "礼节君主与实权统治者必须是不同角色，双方头衔不能相同。"
 SLTM_REL_NEED_TOP_PRIMARY:0 "标记的实权头衔必须是该领国最高领主的主头衔。"
 SLTM_REL_SUCCESS:0 "礼节君主关系已建立"
 SLTM_REL_REMOVED:0 "礼节关系已解除，现有封臣关系保留"
 SLTM_REL_FAILED_RESTORED:0 "未能建立礼节关系，已恢复原关系"
 SLTM_REL_FAILED_PARTIAL:0 "未能完整恢复原状态，请检查领主、政体及头衔"
 SLTM_REL_TAB_SUMMARY:0 "修改摘要"
 SLTM_REL_TAB:0 "礼节关系"
 SLTM_REL_MONARCH_LABEL:0 "王座持有人"
 SLTM_REL_REGENT_LABEL:0 "拟关联的实权头衔与持有人"
 SLTM_REL_REGENT_INFO:0 "[GetPlayer.MakeScope.Var('sltm_designee_title').Title.GetName]\n[GetPlayer.MakeScope.Var('sltm_designee_title').Title.GetHolder.GetName]"
 SLTM_REL_REGENT_MISSING:0 "先在实权者的主头衔页点击“标记头衔”。"
 SLTM_REL_INLINE_EXPLANATION:0 "建立：王座持有人及其领地、封臣归入实权者直属统辖；替换旧关联，保留头衔和政体。\n\n解除：仅取消礼节身份，现有封臣关系保留，不会自动独立。"
 SLTM_REL_CREATE_PARTIAL:0 "礼节王座已创建，但原政体恢复未通过核验"

 SLTM_REL_PAGE_HINT:0 "用于礼节王座。先在实权者的主头衔页点击“标记头衔”，再在此核对双方并建立关系。下方操作立即生效。"

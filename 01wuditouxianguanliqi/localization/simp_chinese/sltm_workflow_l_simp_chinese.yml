 sltm_w_102_title:0 "设置新头衔"
 sltm_w_102_desc:0 "名称：[ROOT.Char.Custom('sltm_workflow_name_text')]\n路线：[ROOT.Char.Custom('sltm_create_kind_text')]；位阶：[ROOT.Char.Custom('sltm_create_tier_text')]\n预设：[ROOT.Char.Custom('sltm_create_preset_text')]\n持有人：[ROOT.Char.MakeScope.Var('sltm_create_holder').Char.GetName]\n[ROOT.Char.Custom('sltm_review_create_geo')]\n外观只有明确选择复制才会写入。\n[ROOT.Char.Custom('sltm_create_rules_text')]"
 sltm_w_102_o0:0 "普通无地预设"
 sltm_w_102_o1:0 "跟随主继承人，禁自动宣称"
 sltm_w_102_o2:0 "继承时销毁"
 sltm_w_102_o3:0 "分别设置首府、法理与住所位置"
 sltm_w_102_o4:0 "三个地理字段均保留构造器默认"
 sltm_w_102_o5:0 "复制模板纹章与颜色"
 sltm_w_102_o6:0 "保留构造器外观默认"
 sltm_w_102_o7:0 "重新选择持有人与路线"
 sltm_w_102_o8:0 "持有人设为模板持有者"
 sltm_w_102_o9:0 "下一步：核对创建"
 sltm_w_102_o10:0 "取消，保留现有对象"
 sltm_w_103_title:0 "核对并创建"
 sltm_w_103_desc:0 "固定方案：[ROOT.Char.Custom('sltm_create_profile_text')]\n将创建一次：[ROOT.Char.Custom('sltm_workflow_name_text')]\n路线：[ROOT.Char.Custom('sltm_create_kind_text')]\n位阶：[ROOT.Char.Custom('sltm_create_tier_text')]\n预设：[ROOT.Char.Custom('sltm_create_preset_text')]\n持有人：[ROOT.Char.MakeScope.Var('sltm_create_holder').Char.GetName]\n费用沿用游戏规则，公爵/国王/皇帝/霸权按旧数值结算；伯爵暂无旧费率，原型免费。原规则的威望是奖励。[ROOT.Char.Custom('sltm_create_cost_text')]\n[ROOT.Char.Custom('sltm_review_create_geo')]\n[ROOT.Char.Custom('sltm_review_create_look')]\n仅实际构造及持有人检查通过后结算。住所路线不写自动销毁规则。\n[ROOT.Char.Custom('sltm_create_rules_text')]"
 sltm_w_103_o0:0 "确认创建"
 sltm_w_103_o1:0 "返回调整"
 sltm_w_103_o2:0 "取消，保留现有对象"
 sltm_w_104_title:0 "创建回执"
 sltm_w_104_desc:0 "输出：头衔 [ROOT.Char.Custom('sltm_created_title_text')]\n住所 [ROOT.Char.Custom('sltm_created_domicile_text')]\n对象读回（1 符合；3 未通过）：持有人 [ROOT.Char.MakeScope.Var('sltm_create_result_holder').GetValue]；位阶 [ROOT.Char.MakeScope.Var('sltm_create_result_tier').GetValue]；普通无地/住所类型与所有者 [ROOT.Char.MakeScope.Var('sltm_create_result_object').GetValue]。\n配置读回（0 未请求；1 符合；3 未通过）：主楼 [ROOT.Char.MakeScope.Var('sltm_create_result_main').GetValue]；首府 [ROOT.Char.MakeScope.Var('sltm_create_result_capital').GetValue]；法理 [ROOT.Char.MakeScope.Var('sltm_create_result_dejure').GetValue]；位置 [ROOT.Char.MakeScope.Var('sltm_create_result_province').GetValue]。\n政治影响：政体 [ROOT.Char.Custom('sltm_before_government_text')] → [ROOT.Char.Custom('sltm_after_government_text')]\n主头衔 [ROOT.Char.Custom('sltm_before_primary_text')] → [ROOT.Char.Custom('sltm_after_primary_text')]\n领主 [ROOT.Char.Custom('sltm_before_liege_text')] → [ROOT.Char.Custom('sltm_after_liege_text')]\n默认住所 [ROOT.Char.Custom('sltm_before_default_text')] → [ROOT.Char.Custom('sltm_after_default_text')]\n旧对象：头衔 [ROOT.Char.MakeScope.Var('sltm_before_titles_count').GetValue] → 仍可读取 [ROOT.Char.MakeScope.Var('sltm_after_old_titles_count').GetValue]；住所 [ROOT.Char.MakeScope.Var('sltm_before_domiciles_count').GetValue] → 仍可读取 [ROOT.Char.MakeScope.Var('sltm_after_old_domiciles_count').GetValue]。\n旧持有人/绑定一致：[ROOT.Char.MakeScope.Var('sltm_old_titles_preserved').GetValue]；旧住所owner/位置/独立主楼保留：[ROOT.Char.MakeScope.Var('sltm_old_domiciles_preserved').GetValue]（1 符合，0 变化）。\nUNKNOWN：旧住所其他建筑与资源完整性、名称外观、未来继承及保存读取仍需核验。\n本次完成码 [ROOT.Char.MakeScope.Var('sltm_create_result').GetValue]（0 无输出，1 部分结果，2 本页可读检查符合）；费用结算路径 [ROOT.Char.MakeScope.Var('sltm_create_cost_settled').GetValue]（1 已处理，费用关闭或伯爵不收费）。不自动重试或销毁返回对象。"
 sltm_w_104_o0:0 "编辑刚创建的头衔"
 sltm_w_104_o1:0 "打开刚创建的实际住所"
 sltm_w_104_o2:0 "完成"
 sltm_w_200_title:0 "后期属性编辑"
 sltm_w_200_desc:0 "目标：[ROOT.Char.MakeScope.Var('sltm_edit_target').Title.GetName]\n此处编辑同一个头衔。只有明确选择的字段会提交；未知原生 getter 不用请求记录冒充。名称/外观/规则标为已请求，首府/法理/住所位置/建筑另做脚本读回。"

 sltm_w_205_title:0 "无地与生命周期"
 sltm_w_205_desc:0 "保持→是→否→保持。只有有草稿的字段会写入。反向设置及未来继承/得地行为均需实机验收；最后请求值不等于原生实际状态。 原生及未知来源住所载体禁止这些间接销毁操作。"

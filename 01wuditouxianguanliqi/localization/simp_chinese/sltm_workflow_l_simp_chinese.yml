 sltm_w_207_o2:0 "打开此头衔的实际住所"
 sltm_w_207_o3:0 "住所字段保持不变"
 sltm_w_207_o4:0 "返回编辑总览"
 sltm_w_208_title:0 "核对编辑草稿"
 sltm_w_208_desc:0 "当前持有人：[ROOT.Char.Custom('sltm_current_holder')]\n当前性别法律：[ROOT.Char.Custom('sltm_current_gender')]；继承法律：[ROOT.Char.Custom('sltm_current_order')]\n目标：[ROOT.Char.MakeScope.Var('sltm_edit_target').Title.GetName]\n只写有草稿的字段，取消不会修改对象。\n使用简称：[ROOT.Char.Custom('sltm_edit_definitive_text')]\n允许家族命名：[ROOT.Char.Custom('sltm_edit_dynasty_text')]\n允许游牧命名：[ROOT.Char.Custom('sltm_edit_nomadic_text')]\n分割继承时跟随主继承人：[ROOT.Char.Custom('sltm_edit_heir_text')]\n禁止自动宣称：[ROOT.Char.Custom('sltm_edit_claims_text')]\n无地属性：[ROOT.Char.Custom('sltm_edit_landless_text')]\n继承时销毁：[ROOT.Char.Custom('sltm_edit_succession_text')]\n无合适继承人时销毁：[ROOT.Char.Custom('sltm_edit_invalid_heir_text')]\n获得同级头衔时销毁：[ROOT.Char.Custom('sltm_edit_same_tier_text')]\n[ROOT.Char.Custom('sltm_review_name')]\n纹章：[ROOT.Char.Custom('sltm_appearance_coa_text')]\n地图颜色：[ROOT.Char.Custom('sltm_appearance_color_text')]\n[ROOT.Char.Custom('sltm_review_capital')]\n[ROOT.Char.Custom('sltm_review_dejure')]\n[ROOT.Char.Custom('sltm_review_province')]\n[ROOT.Char.Custom('sltm_review_building')]\n[ROOT.Char.Custom('sltm_review_laws')]\n持有人/住所绑定若在编辑期间变化，本次提交会返回失败，请重新打开编辑器。\n按基础字段、生命周期、法律先删后加执行，可能部分成功。无可靠即时读取的名称、外观和规则只报告请求；受影响字段与基线不一致时先重新确认。"
 sltm_w_208_o0:0 "提交明确改动的字段"
 sltm_w_208_o1:0 "返回编辑总览"
 sltm_w_208_o2:0 "取消草稿，不写入"
 sltm_w_209_title:0 "编辑回执"
 sltm_w_209_desc:0 "实际读回符合字段：[ROOT.Char.MakeScope.Var('sltm_edit_applied').GetValue]\n失败/未满足对象要求：[ROOT.Char.MakeScope.Var('sltm_edit_failed').GetValue]\n缺可靠即时读回、仅记录请求：[ROOT.Char.MakeScope.Var('sltm_edit_unverified').GetValue]\n逐字段码：0 保持/跳过；1 实际读回符合；2 已请求、未验原生值；3 失败。\n名称：[ROOT.Char.MakeScope.Var('sltm_edit_result_name').GetValue]；纹章：[ROOT.Char.MakeScope.Var('sltm_edit_result_coa').GetValue]；颜色：[ROOT.Char.MakeScope.Var('sltm_edit_result_color').GetValue]；首府：[ROOT.Char.MakeScope.Var('sltm_edit_result_capital').GetValue]；法理：[ROOT.Char.MakeScope.Var('sltm_edit_result_dejure').GetValue]；简称：[ROOT.Char.MakeScope.Var('sltm_edit_result_definitive').GetValue]；家族命名：[ROOT.Char.MakeScope.Var('sltm_edit_result_dynasty').GetValue]；游牧命名：[ROOT.Char.MakeScope.Var('sltm_edit_result_nomadic').GetValue]；主继承人：[ROOT.Char.MakeScope.Var('sltm_edit_result_heir').GetValue]；自动宣称：[ROOT.Char.MakeScope.Var('sltm_edit_result_claims').GetValue]；无地：[ROOT.Char.MakeScope.Var('sltm_edit_result_landless').GetValue]；继承销毁：[ROOT.Char.MakeScope.Var('sltm_edit_result_succession').GetValue]；无继承人销毁：[ROOT.Char.MakeScope.Var('sltm_edit_result_invalid_heir').GetValue]；同级销毁：[ROOT.Char.MakeScope.Var('sltm_edit_result_same_tier').GetValue]；住所位置：[ROOT.Char.MakeScope.Var('sltm_edit_result_province').GetValue]；主建筑：[ROOT.Char.MakeScope.Var('sltm_edit_result_building').GetValue]；添加法律：[ROOT.Char.MakeScope.Var('sltm_edit_result_law_add').GetValue]；移除法律：[ROOT.Char.MakeScope.Var('sltm_edit_result_law_remove').GetValue]；\n此回执不是继承、存读档或未来得地测试通过。重复编辑需重新读取对象并建立新草稿。\n成功数只统计实际读回符合字段；未知 getter 另计未验证，失败字段另计失败。"
 sltm_w_209_o0:0 "重新读取此对象后继续编辑"
 sltm_w_209_o1:0 "完成"
 sltm_w_210_title:0 "确认转让固定对象"
 sltm_w_210_desc:0 "头衔：[ROOT.Char.MakeScope.Var('sltm_transfer_title').Title.GetName]\n原持有人：[ROOT.Char.MakeScope.Var('sltm_transfer_from').Char.GetUIName]\n受领人：[ROOT.Char.Custom('sltm_transfer_recipient_text')]\n\n受领人已经在进入本页时固定。此后改标记或标记头衔易主不会更换受领人；需更换时点重新选择。确认仅转让本头衔，本次尚未提交的其他编辑不执行并结束草稿。若原持有人已改变，请重新选择并核对。"
 sltm_w_210_o0:0 "确认转让给以上受领人"
 sltm_w_210_o1:0 "返回编辑总览"
 sltm_w_211_title:0 "转让回执"
 sltm_w_211_desc:0 "结果：[ROOT.Char.MakeScope.Var('sltm_edit_transfer_result').GetValue]（1 实际持有人读回符合；0 失败）\n头衔 ID 保持，政治关系及继承后果需实机检查。"
 sltm_w_211_o0:0 "完成"
 sltm_w_212_title:0 "转换扩展接口"
 sltm_w_212_desc:0 "等级、key、住所类型和特殊身份转换合同已保留。当前没有同对象转换实现，不提供假成功按钮。默认住所强制切换也未实现；打开指定住所只改变当前窗口目标。"
 sltm_w_212_o0:0 "返回编辑总览"
 sltm_w_create:0 "新建头衔"
 sltm_w_ensure:0 "查找/补建独立宅邸"

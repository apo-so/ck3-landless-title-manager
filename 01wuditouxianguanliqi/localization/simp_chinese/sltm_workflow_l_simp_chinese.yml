 sltm_w_205_o4:0 "返回编辑总览"
 sltm_w_206_title:0 "逐项法律"
 sltm_w_206_desc:0 "高级提交组：每次最多添加一项和移除一项。同项以最后选择为准，提交顺序为基础字段、生命周期、法律先删后加；可能部分成功。修改法律前核对受影响的原版法律组，最终读回实际法律。"

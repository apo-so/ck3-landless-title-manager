 sltm_w_207_title:0 "实际住所编辑"
 sltm_w_207_desc:0 "操作绑定在编辑目标 title.title_domicile，不使用持有人的默认住所。搬迁与头衔首府分开；独立宅邸最低建筑可补全，原生建筑使用原生住所窗口管理。"
 sltm_w_207_o0:0 "搬到标记地点（男爵领本省／其他头衔首府省）"
